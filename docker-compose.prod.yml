services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-toko-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - toko_network

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-toko-rag
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toko_online_adam}
      POSTGRES_USER: ${POSTGRES_USER:-adam_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adamwahyukur}
    ports:
      - "${POSTGRES_PORT:-5453}:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - toko_network

  redis:
    image: redis:7-alpine
    container_name: redis-toko-rag
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6381}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - toko_network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: backend-toko-rag
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-adam_dev}:${POSTGRES_PASSWORD:-adamwahyukur}@postgres-db:5432/${POSTGRES_DB:-toko_online_adam}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_toko_online_adam}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - toko_network

  frontend:
    build:
      context: ./fe
      dockerfile: dockerfile
    container_name: frontend-toko-rag
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 4000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: http://backend:5000
      INTERNAL_API_URL: http://backend:5000/api
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - toko_network

networks:
  toko_network:
    driver: bridge

volumes:
  postgres_main_data:
  redis_data:
  caddy_data:
  caddy_config:
