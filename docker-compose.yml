services:
  redis:
    image: redis:7-alpine
    container_name: redis-toko-online
    ports:
      - "6381:6379"
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db-main
    ports:
      - "5453:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-toko_online_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jangan_pake_password_lemah}
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
      - ./be/src/database/migrations:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-toko_online_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./be:/app
      - /app/node_modules # Proteksi Anonymous Volume
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-jangan_pake_password_lemah}@postgres-db:5432/${DB_NAME:-toko_online_db}
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-development}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    restart: always

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./fe:/app
      - /app/node_modules # Proteksi Anonymous Volume
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    restart: always

volumes:
  postgres_main_data:
  redis_data:
